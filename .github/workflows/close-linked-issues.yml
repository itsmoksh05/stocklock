name: Close linked issues when PR is merged

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues linked to the merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const repositoryName = `${owner}/${repo}`;

            // Read the pull request timeline. Explicit issue-PR connections are
            // exposed as "connected" events whose subject is the linked issue.
            const timelineEvents = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100
              }
            );

            const linkedIssueNumbers = new Set();

            for (const event of timelineEvents) {
              if (
                event.event === "connected" &&
                event.subject?.repository?.full_name === repositoryName &&
                Number.isInteger(event.subject?.number)
              ) {
                linkedIssueNumbers.add(event.subject.number);
              }
            }

            if (linkedIssueNumbers.size === 0) {
              core.info(`No linked issues found for merged PR #${pullNumber}; nothing to close.`);
              return;
            }

            for (const issueNumber of [...linkedIssueNumbers].sort((a, b) => a - b)) {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              // A PullRequest is also represented by the Issues REST API.
              if (issue.pull_request) {
                core.warning(`Skipping #${issueNumber}: it is a pull request, not an issue.`);
                continue;
              }

              if (issue.state === "closed") {
                core.info(`Issue #${issueNumber} is already closed.`);
                continue;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed",
                state_reason: "completed"
              });

              core.notice(`Closed linked issue #${issueNumber} after PR #${pullNumber} was merged.`);
            }
